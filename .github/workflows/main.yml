name: AISZ GAME SPACE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -type f | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP proyek tidak ditemukan!"
            exit 1
          fi

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          find project -name settings.gradle.kts -print

      - name: Locate Project
        id: locate
        run: |
          SETTINGS=$(find project -type f -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/app/build.gradle.kts" ]; then
            echo "Folder app tidak ditemukan"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          gradle --no-daemon -p "${{ steps.locate.outputs.dir }}" clean assembleDebug

      - name: Validate APK
        run: |
          APK="${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AISZ-GAME-SPACE-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
