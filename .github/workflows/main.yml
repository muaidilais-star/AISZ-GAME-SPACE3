name: Build AISZ GAME SPACE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP proyek tidak ditemukan!"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Find Android Project
        id: locate
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan!"
            find project -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/app/build.gradle.kts" ] && [ ! -f "$DIR/app/build.gradle" ]; then
            echo "Folder app tidak ditemukan!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          gradle --no-daemon -p "${{ steps.locate.outputs.project_dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AISZ-GAME-SPACE-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
